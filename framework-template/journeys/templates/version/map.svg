<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Journey map template — [Journey ID], [Version]</title>
  <desc id="desc">An unpopulated journey-map template. Three placeholder stages show where the team should describe user actions, channels, handoffs, difficulties and evidence. No service journey or research finding is asserted.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#49596b"/></marker></defs>
  <rect width="1440" height="520" fill="#f5f7fa"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="48" y="62" font-size="30" font-weight="700">Journey map template</text>
    <text x="48" y="100" font-size="18">[Journey ID] · [Version] · Draft template · Replace placeholders and update description.md together</text>
    <text x="48" y="140" font-size="18">User group: [ID]     Goal: [user goal]     Represents: [current or proposed experience]</text>
    <g stroke="#6b82a0" fill="white" stroke-width="2"><rect x="48" y="190" width="400" height="250" rx="12"/><rect x="520" y="190" width="400" height="250" rx="12"/><rect x="992" y="190" width="400" height="250" rx="12"/></g>
    <g font-size="21" font-weight="700"><text x="76" y="230">[Stage 1]</text><text x="548" y="230">[Stage 2]</text><text x="1020" y="230">[Stage 3]</text></g>
    <g font-size="17"><text x="76" y="272">Action: [what the person does]</text><text x="76" y="308">Channel: [where this happens]</text><text x="76" y="344">Handoff or difficulty: [if known]</text><text x="76" y="380">Evidence: [reference]</text><text x="548" y="272">Action: [what the person does]</text><text x="548" y="308">Channel: [where this happens]</text><text x="548" y="344">Handoff or difficulty: [if known]</text><text x="548" y="380">Evidence: [reference]</text><text x="1020" y="272">Action: [what the person does]</text><text x="1020" y="308">Channel: [where this happens]</text><text x="1020" y="344">Handoff or difficulty: [if known]</text><text x="1020" y="380">Evidence: [reference]</text></g>
    <text x="48" y="484" font-size="17">Template only. Add, remove or branch stages to reflect the actual journey. Record retained versions in design-artefacts.xlsx.</text>
  </g>
  <path d="M452 315H508M924 315H980" fill="none" stroke="#49596b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
